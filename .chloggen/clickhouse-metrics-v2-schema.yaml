# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: enhancement

# The name of the component, or a single word describing the area of concern, (e.g. receiver/filelog)
component: exporter/clickhouse

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Add experimental `metrics_schema: v2` option, a series/points split metrics schema.

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: []

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  The v2 schema stores each label set once per series per day in a dedicated series table and
  writes data points with only a 64-bit series fingerprint, reducing per-point storage and
  insert volume. It adds first-class tables for all metric types (including exponential
  histograms), a shared exemplars table, metric family metadata, and optional 5m/1h rollup
  tables fed by materialized views (float points and explicit-bounds histogram points).
  Attribute maps are written key-sorted for better
  compression and a stable, documented fingerprint. The existing wide schema remains the
  default (`metrics_schema: wide`).

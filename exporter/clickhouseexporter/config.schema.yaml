$defs:
  metric_tables_config:
    type: object
    properties:
      exponential_histogram:
        description: ExponentialHistogram is the table name for exponential histogram metric type. default is `otel_metrics_exponential_histogram`.
        $ref: ./internal/metrics.metric_type_config
      gauge:
        description: Gauge is the table name for gauge metric type. default is `otel_metrics_gauge`.
        $ref: ./internal/metrics.metric_type_config
      histogram:
        description: Histogram is the table name for histogram metric type. default is `otel_metrics_histogram`.
        $ref: ./internal/metrics.metric_type_config
      sum:
        description: Sum is the table name for sum metric type. default is `otel_metrics_sum`.
        $ref: ./internal/metrics.metric_type_config
      summary:
        description: Summary is the table name for summary metric type. default is `otel_metrics_summary`.
        $ref: ./internal/metrics.metric_type_config
  metrics_v_2_config:
    description: MetricsV2Config configures the experimental series/points split metrics schema.
    type: object
    properties:
      exemplars_table_name:
        description: ExemplarsTableName holds exemplars for all metric types. default is `otel_metrics_exemplars`.
        type: string
      exp_histogram_points_table_name:
        description: ExpHistogramPointsTableName holds exponential histogram data points. default is `otel_metrics_exp_histogram_points`.
        type: string
      families_table_name:
        description: FamiliesTableName holds metric family metadata (name, type, unit, description). default is `otel_metrics_families`.
        type: string
      histogram_points_table_name:
        description: HistogramPointsTableName holds histogram data points. default is `otel_metrics_histogram_points`.
        type: string
      points_table_name:
        description: PointsTableName is the table holding gauge and sum data points. default is `otel_metrics_points`.
        type: string
      rollup_ttl:
        description: RollupTTL is the time-to-live for rollup rows (both tiers), e.g. 2160h. 0 (default) keeps rollups forever. Raw tables use the top-level `ttl`.
        type: string
        format: duration
      rollups_enabled:
        description: RollupsEnabled creates 5-minute and 1-hour rollup tables + materialized views over the points and histogram points tables for long-range queries. default is true.
        type: boolean
      series_cache_size:
        description: SeriesCacheSize caps the number of series tracked per day in the in-memory series cache; up to 8 recently-used day generations are kept (LRU). Worst-case memory is 8 x this x ~50 bytes (~400 MiB at the default). A cache miss only causes a duplicate series row, collapsed at merge time. default is 1048576.
        type: integer
      series_table_name:
        description: SeriesTableName is the table holding one row per series per day. default is `otel_metrics_series`.
        type: string
      summary_points_table_name:
        description: SummaryPointsTableName holds summary data points. default is `otel_metrics_summary_points`.
        type: string
  table_engine:
    description: TableEngine defines the ENGINE string value when creating the table.
    type: object
    properties:
      name:
        type: string
      params:
        type: string
description: Config defines configuration for clickhouse exporter.
type: object
properties:
  async_insert:
    description: AsyncInsert if true will enable async inserts. Default is `true`. Ignored if async inserts are configured in the `endpoint` or `connection_params`. Async inserts may still be overridden server-side.
    type: boolean
  cluster_name:
    description: ClusterName if set will append `ON CLUSTER` with the provided name when creating tables.
    type: string
  compress:
    description: 'Compress controls the compression algorithm. Valid options: `none` (disabled), `zstd`, `lz4` (default), `gzip`, `deflate`, `br`, `true` (lz4).'
    type: string
  connection_params:
    description: ConnectionParams is the extra connection parameters with map format. for example compression/dial_timeout
    type: object
    additionalProperties:
      type: string
  create_schema:
    description: CreateSchema if set to true will run the DDL for creating the database and tables. default is true.
    type: boolean
  database:
    description: Database is the database name to export.
    type: string
  endpoint:
    description: Endpoint is the clickhouse endpoint.
    type: string
  json:
    description: JSON enables the JSON column type for attributes in logs and traces tables. When false (default), Map columns are used. When true, JSON columns are used. ClickHouse v25+ is recommended for reliable JSON support. You may also need to add `enable_json_type=1` to your endpoint or connection_params.
    type: boolean
  logs_table_name:
    description: LogsTableName is the table name for logs. default is `otel_logs`.
    type: string
  metrics_schema:
    description: 'MetricsSchema selects the metrics table schema. Valid values: "wide" (default): one denormalized table per metric type, attributes on every row. "v2" (experimental): series/points split schema — label sets are stored once per series per day in a series table and data points reference them via a 64-bit series fingerprint.'
    type: string
  metrics_table_name:
    description: 'MetricsTableName is the table name for metrics. default is `otel_metrics`. Deprecated: MetricsTableName exists for historical compatibility and should not be used. To set the metrics tables name, use the MetricsTables parameter instead.'
    type: string
  metrics_tables:
    description: MetricsTables defines the table names for metric types.
    $ref: metric_tables_config
  metrics_v2:
    description: MetricsV2 configures the experimental v2 metrics schema. Only used when metrics_schema is "v2".
    $ref: metrics_v_2_config
  password:
    description: Password is the authentication password.
    $ref: go.opentelemetry.io/collector/config/configopaque.string
  profiles_table_name:
    description: ProfilesTableName is the table name for profiles. default is `otel_profiles`.
    type: string
  sending_queue:
    x-optional: true
    $ref: go.opentelemetry.io/collector/exporter/exporterhelper.queue_batch_config
  table_engine:
    description: TableEngine is the table engine to use. default is `MergeTree()`.
    $ref: table_engine
  tls:
    description: TLS is the TLS config for connecting to ClickHouse.
    $ref: go.opentelemetry.io/collector/config/configtls.client_config
  traces_table_name:
    description: TracesTableName is the table name for traces. default is `otel_traces`.
    type: string
  ttl:
    description: TTL is The data time-to-live example 30m, 48h. 0 means no ttl.
    type: string
    format: duration
  username:
    description: Username is the authentication username.
    type: string
allOf:
  - $ref: go.opentelemetry.io/collector/exporter/exporterhelper.timeout_config
  - $ref: go.opentelemetry.io/collector/config/configretry.back_off_config
